<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Milan | Server Status</title>

    <style>
        :root {
            --primary: #8B1E3F;
            --primary-dark: #64152D;
            --accent: #C49A5A;

            --background: #FAF8F5;
            --surface: #FFFFFF;

            --text: #211D1E;
            --muted: #6F6869;

            --border: #E8E1DF;
            --success: #2E7D5B;

            --shadow:
                0 18px 50px rgba(33, 29, 30, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background: var(--background);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 18px;

            padding: 48px;

            box-shadow: var(--shadow);
        }

        .brand {
            margin-bottom: 42px;
        }

        .brand-name {
            color: var(--primary);

            font-size: 24px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .brand-line {
            width: 32px;
            height: 2px;

            margin-top: 10px;

            background: var(--accent);
        }

        .status {
            display: flex;
            align-items: center;

            gap: 10px;

            margin-bottom: 18px;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 0 4px rgba(46, 125, 91, 0.10);
        }

        .status-text {
            color: var(--success);

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 14px;

            font-size: 36px;
            line-height: 1.15;

            letter-spacing: -1.2px;
        }

        .description {
            color: var(--muted);

            font-size: 16px;
            line-height: 1.7;

            margin-bottom: 34px;
        }

        .details {
            border-top: 1px solid var(--border);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 17px 0;

            border-bottom: 1px solid var(--border);
        }

        .detail-label {
            color: var(--muted);

            font-size: 14px;
        }

        .detail-value {
            color: var(--text);

            font-size: 14px;
            font-weight: 600;
        }

        .footer {
            margin-top: 30px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.6;

            text-align: center;
        }

        @media (max-width: 560px) {
            .card {
                padding: 32px 24px;
                border-radius: 16px;
            }

            h1 {
                font-size: 30px;
            }

            .brand {
                margin-bottom: 32px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="brand">
                <div class="brand-name">
                    Milan
                </div>

                <div class="brand-line"></div>
            </div>

            <div class="status">
                <span class="status-dot"></span>

                <span class="status-text">
                    Operational
                </span>
            </div>

            <h1>
                Server is running
            </h1>

            <p class="description">
                The Milan Matrimony backend is running successfully.
                The API is ready to accept requests.
            </p>

            <div class="details">

                <div class="detail-row">
                    <span class="detail-label">
                        Environment
                    </span>

                    <span class="detail-value">
                        Development
                    </span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">
                        Framework
                    </span>

                    <span class="detail-value">
                        FastAPI
                    </span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">
                        API Status
                    </span>

                    <span class="detail-value">
                        Healthy
                    </span>
                </div>

            </div>

            <div class="footer">
                Milan Matrimony Platform · Backend Services
            </div>

        </section>

    </main>

</body>
</html>
